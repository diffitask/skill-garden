name: PR status
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
concurrency:
  group: pr-status
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always run trusted default-branch code, never a PR head or downloaded artifact.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reconcile open PR labels
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_REPOSITORY: ${{ github.repository }}
        run: node .air/scripts/sync-open-pr-status.mjs
